name: Pronostics Coupe du Monde 2026
on:
  workflow_dispatch:
    inputs:
      fast:
        description: "Mode rapide (sans forme/H2H)"
        type: boolean
        default: false

jobs:
  cdm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python main.py --type coupe-du-monde ${{ inputs.fast && '--fast' || '' }}
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY:      ${{ secrets.DEEPSEEK_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          REPORT_EMAIL_FROM:     ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO:       ${{ secrets.REPORT_EMAIL_TO }}
          SMTP_PASSWORD:         ${{ secrets.SMTP_PASSWORD }}
